[project]
name = "life-archive"
version = "0.1.0"
description = "Complete digital life research and publishing platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "orjson>=3.10.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pymupdf>=1.23.0",
]

[project.optional-dependencies]
# lexical search index (optional - the engine degrades to manifest scanning)
search = ["meilisearch>=0.31.0"]
# media metadata + hashing for large archives
media = ["mutagen>=1.47.0", "xxhash>=3.4.0", "pillow>=10.4.0"]
# running the test suite
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
[project.scripts]
life-archive = "life_archive.cli:app"

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# The package lives under python/; without this, flat-layout auto-discovery
# picks up the empty src/ skeleton and misses life_archive entirely.
where = ["python"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
